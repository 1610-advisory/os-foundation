# Filled by bootstrap.sh. Markers are OSF_RUNNER_UUID and OSF_RUNNER_TOKEN.
# The filled file lives outside the repo, in the runner volume.

log:
  level: info
  job_level: info

runner:
  file: /data/.runner
  capacity: 1
  timeout: 3h
  shutdown_timeout: 5s
  fetch_interval: 2s
  fetch_timeout: 30s
  report_interval: 1s
  insecure: false
  labels:
    - "ubuntu-latest:docker://osf-acme-job:local"
  envs:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: /certs/client
    OS_REVIEW_FAKE: /opt/os-review-fake/verdicts.txt

cache:
  enabled: false

container:
  network: host
  privileged: false
  options: "-v /certs/client:/certs/client:ro -v /opt/os-review-fake:/opt/os-review-fake:ro"
  valid_volumes:
    - /certs/client
    - /opt/os-review-fake
  docker_host: "-"
  force_pull: false
  force_rebuild: false

host:
  workdir_parent: /data/work

server:
  connections:
    acme:
      url: http://forgejo:3000
      uuid: OSF_RUNNER_UUID
      token: OSF_RUNNER_TOKEN
