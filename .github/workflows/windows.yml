name: windows

on:
  workflow_dispatch:
  pull_request:
    paths:
      - template/skills/sync/**
      - template/skills/add-teammate/**
      - template/skills/lint/**
      - template/skills/_host/**
      - template/.gitattributes
      - .gitattributes
      - tests/windows/**
      - tests/team/test_join_old.sh
      - .github/workflows/windows.yml

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  s15:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: powershell
            exe: powershell
          - name: pwsh
            exe: pwsh
    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: S15 ${{ matrix.name }}
        shell: cmd
        run: ${{ matrix.exe }} -NoProfile -ExecutionPolicy Bypass -File tests\windows\s15.ps1
      - name: B74 gh api paths in Git Bash
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tests/windows/b74.sh
      - name: B82 git home folder in Git Bash
        shell: bash
        run: bash tests/windows/b82.sh
